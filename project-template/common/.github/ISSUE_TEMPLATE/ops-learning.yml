name: Ops learning
description: A fix worth remembering. These become runbook entries.
title: "Ops: "
labels: [ops-learning]
body:
  - type: input
    id: symptom
    attributes:
      label: Symptom
      description: What you saw first.
    validations:
      required: true
  - type: input
    id: cause
    attributes:
      label: Cause
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Diagnose and fix
      description: Exact commands. Secrets redacted.
    validations:
      required: true
  - type: input
    id: verify
    attributes:
      label: How to verify
