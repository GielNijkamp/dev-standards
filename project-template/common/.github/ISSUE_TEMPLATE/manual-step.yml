name: Manual step
description: A change made outside the code (console, DNS, OAuth app, licence, manual migration).
title: "Manual: "
labels: [manual-step]
body:
  - type: input
    id: where
    attributes:
      label: System and environment
      placeholder: e.g. Cloudflare DNS, prod
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What was changed
      description: Exact settings or commands. Never secret values.
    validations:
      required: true
  - type: dropdown
    id: iac
    attributes:
      label: Can it move into code?
      options:
        - "Yes, done in this change"
        - "Yes, follow-up ticket needed"
        - "No, stays manual"
    validations:
      required: true
