name: Direction change
description: Something we agreed or built changes direction. Supersede, never delete.
title: "Direction change: "
labels: [direction-change, needs-triage]
body:
  - type: input
    id: from
    attributes:
      label: From
      description: Current direction. Link the ADR, spec or SOW section.
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: To
      description: New direction.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why and who decided
      placeholder: |
        Reason:
        Decided by:
        Source (link, quoted sentence):
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Change type
      options: [integration or source, scope in, scope out, compliance or region, stack swap, deadline or budget, team]
    validations:
      required: true
  - type: textarea
    id: superseded
    attributes:
      label: Superseded items
      description: ADRs, issues and acceptance criteria this replaces.
  - type: input
    id: approval
    attributes:
      label: Client approval link
      description: Link to the approver's written yes. Leave empty until you have it.
  - type: textarea
    id: regenerate
    attributes:
      label: Deliverables to update
      value: |
        - [ ] 01 SOW
        - [ ] 02 Solution design
        - [ ] 04 Infrastructure
        - [ ] 05 Tests and quality
        - [ ] 06 CI/CD
        - [ ] 07 Runbook
        - [ ] 08 Data
        - [ ] 09 Access
        - [ ] 10 Monitoring
        - [ ] 12 Acceptance
        - [ ] 13 Known issues
