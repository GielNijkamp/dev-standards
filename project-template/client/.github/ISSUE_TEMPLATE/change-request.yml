name: Change request
description: New client ask. No work before the approval link is filled in.
title: "CR: "
labels: [change-request, enhancement, needs-triage]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the email or transcript.
    validations:
      required: true
  - type: input
    id: requested-by
    attributes:
      label: Requested by
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      placeholder: "Hours, fee, dates, affected specs"
  - type: input
    id: approval
    attributes:
      label: Client approval link
      description: Link to the approver's written yes. Empty until you have it.
