name: Tech debt
description: A shortcut or workaround we took on purpose.
title: "Debt: "
labels: [tech-debt]
body:
  - type: textarea
    id: what
    attributes:
      label: What and where
      description: The shortcut, and the file or component.
    validations:
      required: true
  - type: input
    id: why
    attributes:
      label: Why we took it
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: Cost of leaving it
      description: What breaks or gets slower over time.
  - type: input
    id: fix
    attributes:
      label: Fix and effort
      placeholder: e.g. replace with retry queue, ~4 h
